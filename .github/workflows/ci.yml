name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  # Called by deploy-admin-test.yml so the deploy is gated on exactly these
  # checks, rather than on a second copy of them that could drift.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
