<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-hidden="true">
  <rect width="800" height="400" fill="#F3F2F2" />

  <!-- Абстрактная сетка «улиц» — декоративная, без привязки к реальной географии. -->
  <g stroke="#DADADA" stroke-width="2">
    <line x1="0" y1="90" x2="800" y2="70" />
    <line x1="0" y1="190" x2="800" y2="210" />
    <line x1="0" y1="300" x2="800" y2="320" />
    <line x1="120" y1="0" x2="140" y2="400" />
    <line x1="340" y1="0" x2="360" y2="400" />
    <line x1="560" y1="0" x2="540" y2="400" />
    <line x1="680" y1="0" x2="700" y2="400" />
  </g>

  <!-- Линия маршрута — пунктир, тот же приём, что «карта-иллюстрация» на
       фирменной странице Ocean Basket: статичная картинка вместо живой
       карты, только форма маршрута, без реальных координат остановок. -->
  <path
    d="M 90 300 C 180 200, 220 320, 300 230 S 420 120, 470 190 S 600 300, 660 150 S 730 90, 740 100"
    fill="none"
    stroke="#B33036"
    stroke-width="4"
    stroke-linecap="round"
    stroke-dasharray="2 14"
  />

  <!-- Пины — декоративные, без цифр (порядок и число остановок показывает
       список карточек под картой, тот единственный источник, которому можно
       верить). -->
  <g fill="#B33036" stroke="#FFFFFF" stroke-width="3">
    <circle cx="90" cy="300" r="12" />
    <circle cx="300" cy="230" r="12" />
    <circle cx="470" cy="190" r="12" />
    <circle cx="660" cy="150" r="12" />
    <circle cx="740" cy="100" r="12" />
  </g>
</svg>
